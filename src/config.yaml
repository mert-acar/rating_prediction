dataset:
  test_size: 0.2
  random_state: 9001
  discount_bins: [0.0, 0.2, 0.6, 1.0]
  top_categories: ['Sports & Outdoors', 'Health & Personal Care', 'AMAZON FASHION']
  price_stats:
    mean: 3.16547
    std: 0.74346

model:
  encoding_model: "sentence-transformers/all-MiniLM-L6-v2"
  
training:
  data_path: ../data/feat_text/
  device: mps
  batch_size: 8  # Reduced batch size for better generalization
  num_epochs: 10000
  early_stop_patience: 10
  optimizer_args:
    lr: 0.0005  # Reduced learning rate for more stable multi-task training
    weight_decay: 0.01  # Increased weight decay for better regularization
  scheduler_args:
    factor: 0.5 
    patience: 5  # Increased patience for learning rate reduction
  output_path: ../logs/experiment_1
